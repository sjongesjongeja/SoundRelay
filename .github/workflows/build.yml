name: Build SoundRelay (Windows, Android & iOS)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundRelay-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build iOS App Archive
        run: |
          cd ios
          xcodebuild -project SoundRelay.xcodeproj -scheme SoundRelay -configuration Release -destination 'generic/platform=iOS' -archivePath build/SoundRelay.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/SoundRelay.xcarchive/Products/Applications/SoundRelay.app Payload/
          zip -r SoundRelay.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SoundRelay-iOS-IPA
          path: ios/SoundRelay.ipa

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Windows Executable (PyInstaller)
        run: |
          pyinstaller --noconfirm --onedir --name "SoundRelay" `
            --distpath "dist" --workpath "build_pyinstaller" `
            --add-data "server/static;static" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespan.on" `
            --collect-all "sounddevice" `
            --collect-all "uvicorn" `
            --collect-all "fastapi" `
            "server/run.py"

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/SoundRelay.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: SoundRelay-Windows-Setup
          path: bin/SoundRelay-Setup.exe

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SoundRelay-Android-APK/*.apk
            SoundRelay-iOS-IPA/*.ipa
            SoundRelay-Windows-Setup/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
